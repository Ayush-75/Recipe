name: Deploy to Google Play Store

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo $GOOGLE_SERVICES_JSON | base64 -di > app/google-services.json

      - name: Create keystore.properties
        run: |
          touch keystore.properties
          echo "apiKey=${{ secrets.API_KEY }}" >> keystore.properties

      - name: Grant execute permissions for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew clean testDebug

  distribute:
    name: Deploy to Google Play Store
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo $GOOGLE_SERVICES_JSON | base64 -di > app/google-services.json

      - name: Create keystore.properties
        run: |
          touch keystore.properties
          echo "apiKey=${{ secrets.API_KEY }}" >> keystore.properties

      - name: Grant execute permissions for gradlew
        run: chmod +x gradlew

      - name: Build AAB
        run: ./gradlew bundleRelease

      - name: Sign the release bundle
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.RECIPE_KEYSTORE }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          alias: ${{ secrets.RECIPE_ALIAS }}
          keyPassword: ${{ secrets.RECIPE_ALIAS_PASSWORD }}

      - name: Setup Play Store API
        env:
          PLAY_CONFIG_JSON: ${{ secrets.PLAY_CONFIG }}
        run: echo $PLAY_CONFIG_JSON | base64 -di > play_config.json

      # ✅ FIXED Ruby setup (no manual bundle install!)
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2
          bundler-cache: true

      # ✅ Optional debug (remove later)
      - name: Debug files
        run: |
          ls -la
          bundle list

      - name: Upload to Play Store
        run: bundle exec fastlane upload_to_play_store