name: Deploy to Google Play Store

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  test:
    name: Unit Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew clean testDebug

  distribute:
    name: Deploy to Google Play
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      # ✅ Firebase / Google config
      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo $GOOGLE_SERVICES_JSON | base64 -di > app/google-services.json

      - name: Grant execute permission
        run: chmod +x gradlew

      # ✅ Build AAB
      - name: Build Release Bundle
        run: ./gradlew bundleRelease

      # ✅ (Optional but recommended) Verify AAB exists
      - name: Verify AAB
        run: ls app/build/outputs/bundle/release/

      # ✅ Sign AAB
      - name: Sign Release
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.RECIPE_KEYSTORE }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          alias: ${{ secrets.RECIPE_ALIAS }}
          keyPassword: ${{ secrets.RECIPE_ALIAS_PASSWORD }}

      # ✅ Setup Play Store API
      - name: Setup Play Store API
        run: echo '${{ secrets.PLAY_CONFIG }}' > service_account.json

      # ✅ Upload to Play Store
      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJson: service_account.json
          packageName: com.labs.recipe
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed